name = "matriculate-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# The paid tables are bundled as text at deploy time rather than stored in KV:
# they are static between deploys, and a bundled import costs no read.
rules = [
  { type = "Text", globs = ["**/*.txt"], fallthrough = true }
]

# Filled in by `wrangler kv namespace create LICENCES`.
[[kv_namespaces]]
binding = "LICENCES"
id = "REPLACE_WITH_KV_ID"

[vars]
# Origins allowed to call this API, comma separated.
SITE = "https://matriculate.pages.dev"

# Sandbox while testing: https://sandbox-api.paddle.com
PADDLE_API = "https://sandbox-api.paddle.com"

# The Paddle price being sold, and the page on our own domain that carries
# Paddle.js. Paddle must approve that domain before the hosted checkout works.
# Matriculate Plus is a subscription, so there are two prices.
PRICE_YEARLY = "pri_01m2vt6mcdgshk0a6hx42p4sr0"
PRICE_MONTHLY = "pri_01m2vt3m7m6jrd9f7ync0m7t1n"
# Cloudflare Pages serves this without the .html and redirects the .html form,
# so the extension-less address is the real one. It must match the default
# payment link in the Paddle dashboard exactly.
CHECKOUT_URL = "https://matriculate.pages.dev/checkout"

# Secrets are NOT set here. Set them once, from the terminal:
#   wrangler secret put PADDLE_API_KEY    # pdl_sdbx_apikey_... then pdl_live_apikey_...
#   wrangler secret put PADDLE_WEBHOOK    # pdl_ntfset_...
